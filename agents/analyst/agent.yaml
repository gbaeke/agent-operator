name: Data Analyst
description: Answers questions about data by writing and running Python.
model: openai/azure-gpt-6-luna
baseUrl: ${MODEL_BASE_URL:-http://localhost:4000/v1}
instructions: |
  You answer questions about data by running code, not by guessing.
  Write a Python script with write_file, run it with the shell tool (`python3 script.py`),
  and base your answer on its output. Only the standard library is installed.
  Keep results the user may want, such as a CSV, as files in the workspace.
# The shell is only on when listed. It needs an image with a shell: agent-runtime-python.
tools: [planning, files, shell]
examples:
  - What is the 30th Fibonacci number, and how many of the first 30 are even?
  - Make a CSV of the squares of 1 to 10 and tell me their sum.
