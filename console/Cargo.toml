[package]
name = "agent-console"
version = "0.1.0"
edition = "2024"
description = "One web UI for many agents: lists them and proxies their API."

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
futures = "0.3.34"
k8s-openapi = { version = "0.29", features = ["v1_35"] }
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "runtime"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
