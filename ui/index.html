<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Lexend:wght@400;500;600;700;800&display=swap">
<script>
  // The blog's two themes: light by default, the toggle remembers the choice. Set before the first paint.
  try {
    const saved = localStorage.getItem("theme");
    const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    if (dark) document.documentElement.dataset.theme = "dark";
  } catch {}
</script>
<style>
  /* The baeke.info look: sky-blue pages, black keylines, a yellow name tile, white call-out boxes, brick markers. */
  :root {
    --bg: #e8f4fb; --surface: #ffffff; --sunk: #d3e9f6; --text: #16222b; --heading: #0e1317; --soft: #263b4a;
    --muted: #3c5468; --line: #a5cfe6; --rule: #0e1317;
    --accent: #ffd500; --accent-ink: #0a4d8c; --on-accent: #0e1317; --link: #0a4d8c; --brick: #d62828; --blue: #2a7de1;
    --ok: #1d7a43; --warn: #b26a00; --err: #c62020; --mark: #ffe04d;
    --key: 2px; --bar: 3px;
    --sans: "Lexend", system-ui, sans-serif;
    --read: "Atkinson Hyperlegible Next", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d2233; --surface: #14304a; --sunk: #1b3d5c; --text: #d9eaf5; --heading: #f4faff; --soft: #b9d3e4;
    --muted: #8fb0c6; --line: #2a4d6b; --rule: #f4faff;
    --accent-ink: #ffd500; --link: #7cc4ff; --brick: #ff6b5e; --ok: #5fd08f; --warn: #ffc14d; --err: #ff7a6e; --mark: rgb(255 213 0 / .32);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 var(--read); height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  :focus-visible { outline: var(--key) solid var(--heading); outline-offset: 2px; }
  ::selection { background: var(--mark); color: var(--heading); }
  h1, h2, h3 { font-family: var(--sans); color: var(--heading); letter-spacing: -.03em; line-height: 1.15; }

  header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: var(--bar) solid var(--rule); flex-wrap: wrap; }
  .brand { font: 800 1.1rem/1 var(--sans); letter-spacing: -.05em; color: var(--on-accent); text-decoration: none; padding: .42em .6em .46em; border: var(--key) solid var(--rule); border-radius: 10px 10px 10px 0; background: var(--accent); white-space: nowrap; }
  :root[data-theme="dark"] .brand { border-color: #0e1317; }
  .brand span { color: #d62828; }
  header h1 { font-size: 1.15rem; font-weight: 700; margin: 0; }
  header .meta { color: var(--muted); font: 400 .82rem/1.4 var(--sans); flex: 1; min-width: 0; }
  button { font: 500 .9rem var(--sans); border: var(--key) solid var(--rule); background: var(--surface); color: var(--heading); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: var(--accent); color: var(--on-accent); }
  button.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.primary:hover { background: var(--heading); color: var(--bg); }
  button:disabled { opacity: .45; cursor: default; }
  button:disabled:hover { background: var(--surface); color: var(--heading); }
  .icon-button { width: 38px; height: 38px; padding: 0; border: 0; border-radius: 999px; background: transparent; display: grid; place-items: center; }
  .icon-button:hover { background: rgb(14 19 23 / .1); color: var(--heading); }
  :root[data-theme="dark"] .icon-button:hover { background: rgb(244 250 255 / .12); }
  .icon-button svg { width: 19px; height: 19px; }
  .theme-toggle .sun, :root[data-theme="dark"] .theme-toggle .moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .sun { display: block; }

  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
  body[data-mode="console"] main { grid-template-columns: 250px minmax(0, 1fr) 400px; }
  nav { display: none; border-right: var(--key) solid var(--rule); overflow-y: auto; padding: 14px 12px; }
  body[data-mode="console"] nav { display: block; }
  /* Section labels: a 1x1 brick seen from above */
  .label { display: flex; align-items: center; gap: 10px; font: 600 .84rem var(--sans); color: var(--heading); margin: 0 2px 12px; }
  .label::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--rule); border-radius: 3px; background: var(--accent); flex: none; }
  nav button { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 9px 11px; border-radius: 12px 12px 12px 0; }
  nav button:hover { background: var(--sunk); color: var(--heading); }
  nav button.active { background: var(--accent); color: var(--on-accent); }
  nav button.active .desc { color: var(--on-accent); }
  nav button:disabled { opacity: .55; }
  nav .name { font: 600 .95rem var(--sans); display: flex; align-items: center; gap: 8px; }
  nav .name::before { content: ""; width: 10px; height: 10px; border: 2px solid var(--rule); border-radius: 3px; background: var(--ok); flex: none; }
  nav button.active .name::before { border-color: #0e1317; }
  nav button.down .name::before { background: var(--err); }
  nav button.busy .name::before { background: var(--accent); animation: pulse 1s infinite; }
  nav .desc { font: 400 .8rem/1.4 var(--sans); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }

  #chat { display: flex; flex-direction: column; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 26px max(18px, calc((100% - 780px) / 2)); }
  .msg { margin: 0 0 20px; }
  .msg.user { background: var(--heading); color: var(--bg); padding: 10px 14px; border-radius: 10px 10px 3px 10px; white-space: pre-wrap; margin-left: 18%; width: fit-content; max-width: 82%; margin-left: auto; }
  .msg.assistant .body > :first-child { margin-top: 0; }
  .msg.assistant table { border-collapse: collapse; margin: 10px 0; font: 400 .9rem/1.5 var(--sans); }
  .msg.assistant th, .msg.assistant td { border-bottom: 1px solid var(--line); padding: 5px 12px 5px 0; text-align: left; }
  .msg.assistant th { border-bottom: var(--bar) solid var(--rule); color: var(--heading); }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { font-size: 1.1rem; margin: 1em 0 .4em; }
  pre, code { font-family: var(--mono); }
  :not(pre) > code { font-size: .84em; background: var(--surface); border-radius: 5px; padding: .1em .38em; }
  pre { font-size: 13px; line-height: 1.6; background: var(--surface); border: var(--key) solid var(--rule); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
  .chip-tool { display: inline-flex; gap: 6px; align-items: center; font: 500 .76rem var(--sans); color: var(--heading); background: var(--surface); border: var(--key) solid var(--rule); border-radius: 8px; padding: 2px 9px; margin: 2px 4px 8px 0; }
  .chip-tool::before { content: ""; width: 9px; height: 9px; border: 2px solid var(--rule); border-radius: 2px; flex: none; }
  .chip-tool.running::before { background: var(--accent); animation: pulse 1s infinite; }
  .chip-tool.ok::before { background: var(--ok); }
  .chip-tool.err { border-color: var(--err); color: var(--err); }
  .chip-tool.err::before { background: var(--err); border-color: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .chip-tool.running::before, nav button.busy .name::before { animation: none; } }
  .usage { font: 400 .76rem var(--sans); color: var(--muted); }
  #messages .examples { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  #messages .examples button { text-align: left; font: 400 .9rem/1.45 var(--read); max-width: 380px; border-radius: 12px 12px 12px 0; padding: 10px 13px; }
  .empty h2 { margin: 36px 0 6px; font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -.04em; }
  .empty p { color: var(--soft); margin: 0 0 16px; max-width: 36em; }
  form { display: flex; gap: 10px; padding: 14px max(18px, calc((100% - 780px) / 2)); border-top: var(--bar) solid var(--rule); }
  textarea { flex: 1; font: 400 1rem/1.5 var(--read); resize: none; padding: 10px 12px; border-radius: 12px 12px 12px 0; border: var(--key) solid var(--rule); background: var(--surface); color: var(--heading); height: 66px; }
  textarea:focus { outline: var(--key) solid var(--heading); outline-offset: 2px; }
  textarea::placeholder { color: var(--muted); }
  form button { align-self: stretch; padding: 0 18px; }

  aside { border-left: var(--key) solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: var(--key) solid var(--rule); padding: 0 8px; }
  .tabs button { flex: 1; border: 0; border-radius: 0; padding: 12px 6px 10px; background: transparent; color: var(--muted); font-weight: 500; }
  .tabs button:hover { background: transparent; color: var(--heading); }
  .tabs button.active { color: var(--heading); font-weight: 600; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; }
  .tabs .count { font: 600 .72rem var(--sans); background: var(--accent); color: var(--on-accent); border-radius: 6px; padding: 0 6px; margin-left: 6px; text-decoration: none; display: inline-block; }
  .pane { flex: 1; overflow-y: auto; padding: 16px; display: none; } .pane.active { display: block; }
  .todo { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font: 400 .9rem/1.45 var(--sans); }
  .todo .box { width: 18px; flex: none; text-align: center; color: var(--accent-ink); }
  .todo.completed span:last-child { color: var(--muted); text-decoration: line-through; }
  .todo.in_progress span:last-child { font-weight: 600; color: var(--heading); }
  .file { border: var(--key) solid var(--rule); border-radius: 12px 12px 12px 0; margin-bottom: 12px; background: var(--surface); }
  .file summary { cursor: pointer; padding: 8px 12px; font: 500 .8rem var(--mono); color: var(--heading); }
  .file .content { padding: 4px 14px 12px; font-size: .92rem; border-top: var(--key) solid var(--rule); }
  .event { font: 400 .8rem/1.45 var(--sans); border-left: 4px solid var(--line); padding: 4px 10px; margin-bottom: 10px; word-break: break-word; }
  .event.call { border-color: var(--accent); } .event.result { border-color: var(--ok); } .event.error { border-color: var(--err); }
  .event.sub { border-color: var(--blue); margin-left: 12px; }
  .event b { font-family: var(--mono); font-weight: 500; color: var(--heading); }
  .event pre { margin: 5px 0 0; max-height: 160px; overflow: auto; white-space: pre-wrap; font-size: 11.5px; padding: 8px 10px; border-width: 1px; border-radius: 6px; }
  .muted { color: var(--muted); font: 400 .88rem/1.5 var(--sans); }
  @media (max-width: 900px) {
    body { height: auto; }
    main, body[data-mode="console"] main { grid-template-columns: 1fr; grid-template-rows: auto minmax(60vh, 1fr) 40vh; }
    nav { border-right: 0; border-bottom: var(--key) solid var(--rule); max-height: 30vh; }
    aside { border-left: 0; border-top: var(--key) solid var(--rule); }
    .msg.user { max-width: 92%; }
  }
</style>
</head>
<body data-mode="agent">
<header>
  <span class="brand">agent<span id="brand-kind">.runtime</span></span>
  <h1 id="title">Agent</h1>
  <div class="meta" id="meta">connecting…</div>
  <button class="icon-button theme-toggle" id="theme" type="button" aria-label="Switch between light and dark">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button id="reset" type="button">New chat</button>
</header>
<main>
  <nav><div class="label">Agents</div><div id="agents"></div></nav>
  <section id="chat">
    <div id="messages"></div>
    <form id="form">
      <textarea id="input" placeholder="Ask something… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>
  <aside>
    <div class="tabs">
      <button data-tab="plan" class="active">Plan<span class="count" id="c-plan">0</span></button>
      <button data-tab="files">Files<span class="count" id="c-files">0</span></button>
      <button data-tab="activity">Activity<span class="count" id="c-activity">0</span></button>
    </div>
    <div class="pane active" id="pane-plan"></div>
    <div class="pane" id="pane-files"></div>
    <div class="pane" id="pane-activity"></div>
  </aside>
</main>
<script>
// One page, two modes. "agent": served by one agent, API under v1/.
// "console": served by the console, one view per agent, API under api/agents/<id>/.
// Each view keeps its own session, messages, plan, files and activity, so
// switching agents keeps every conversation. All URLs are relative.
const MODE = document.body.dataset.mode;
const $ = (id) => document.getElementById(id);
const views = new Map();
let current = null;

const newSession = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const md = (text) => DOMPurify.sanitize(marked.parse(text || ""));
function esc(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}
function node(className, html = "") {
  const div = document.createElement("div");
  div.className = className;
  div.innerHTML = html;
  return div;
}

function makeView(id, info, base) {
  const view = {
    id, info, base, sessionId: newSession(), busy: false, activityCount: 0, counts: { plan: 0, files: 0 },
    messages: node("view"),
    plan: node("view", '<p class="muted">The agent\'s todo list appears here when it plans a multi-step task.</p>'),
    files: node("view", '<p class="muted">Files the agent writes to its scratch workspace appear here.</p>'),
    activity: node("view", '<p class="muted">Every tool call, result and subagent step, live.</p>'),
  };
  const empty = node("empty", `<h2>Ask ${esc(info.name)}</h2><p>${esc(info.description || "")}</p><div class="examples"></div>`);
  for (const example of info.examples || []) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = example;
    button.onclick = () => { $("input").value = example; send(); };
    empty.querySelector(".examples").appendChild(button);
  }
  view.messages.appendChild(empty);
  return view;
}

function describe(info) {
  const parts = [info.model];
  if (info.documents?.length) parts.push(`${info.documents.length} documents`);
  if (info.skills?.length) parts.push(`skills: ${info.skills.join(", ")}`);
  if (info.subagents?.length) parts.push(`subagents: ${info.subagents.join(", ")}`);
  if (info.mcp_tools?.length) parts.push(`MCP tools: ${info.mcp_tools.join(", ")}`);
  return parts.join(" · ");
}

function show(view) {
  current = view;
  document.title = MODE === "console" ? `${view.info.name} · agent.console` : view.info.name;
  $("title").textContent = view.info.name;
  $("meta").textContent = describe(view.info);
  $("messages").replaceChildren(view.messages);
  $("pane-plan").replaceChildren(view.plan);
  $("pane-files").replaceChildren(view.files);
  $("pane-activity").replaceChildren(view.activity);
  refreshChrome();
  scrollDown(view);
  $("input").focus();
}

function refreshChrome() {
  if (!current) return;
  $("c-plan").textContent = current.counts.plan;
  $("c-files").textContent = current.counts.files;
  $("c-activity").textContent = current.activityCount;
  $("send").disabled = current.busy;
  for (const button of $("agents").children) {
    button.classList.toggle("active", button.dataset.id === current.id);
    button.classList.toggle("busy", views.get(button.dataset.id)?.busy ?? false);
  }
}

function scrollDown(view) {
  if (view !== current) return;
  $("messages").scrollTop = $("messages").scrollHeight;
  $("pane-activity").scrollTop = $("pane-activity").scrollHeight;
}

document.querySelectorAll(".tabs button").forEach((tab) => {
  tab.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((t) => t.classList.toggle("active", t === tab));
    document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("active", p.id === "pane-" + tab.dataset.tab));
  };
});

function renderWorkspace(view, ws) {
  const icons = { pending: "○", in_progress: "◐", completed: "●" };
  view.counts.plan = ws.todos.length;
  view.plan.innerHTML = ws.todos.length
    ? ws.todos.map((t) => `<div class="todo ${t.status}"><span class="box">${icons[t.status] || "○"}</span><span>${esc(t.content)}</span></div>`).join("")
    : '<p class="muted">No plan yet.</p>';
  const files = Object.entries(ws.files);
  view.counts.files = files.length;
  const open = new Set([...view.files.querySelectorAll(".file[open]")].map((f) => f.dataset.path));
  view.files.innerHTML = files.length
    ? files.map(([path, content]) => `<details class="file" data-path="${esc(path)}" ${open.has(path) || files.length === 1 ? "open" : ""}><summary>${esc(path)} · ${content.length} bytes</summary><div class="content">${path.endsWith(".md") ? md(content) : `<pre>${esc(content)}</pre>`}</div></details>`).join("")
    : '<p class="muted">No files yet.</p>';
  if (view === current) refreshChrome();
}

function activity(view, kind, html) {
  if (view.activityCount === 0) view.activity.innerHTML = "";
  view.activityCount += 1;
  view.activity.appendChild(node("event " + kind, html));
  if (view === current) refreshChrome();
}

function addMessage(view, role) {
  view.messages.querySelector(".empty")?.remove();
  const div = node("msg " + role);
  view.messages.appendChild(div);
  return div;
}

async function send() {
  const view = current;
  const text = $("input").value.trim();
  if (!view || !text || view.busy) return;
  view.busy = true;
  refreshChrome();
  $("input").value = "";
  addMessage(view, "user").textContent = text;

  const msg = addMessage(view, "assistant");
  msg.innerHTML = '<div class="tools"></div><div class="body"></div><div class="usage"></div>';
  const toolsEl = msg.querySelector(".tools");
  const bodyEl = msg.querySelector(".body");
  const chips = {};
  let answer = "";

  const handle = (event) => {
    switch (event.type) {
      case "text":
        answer += event.delta;
        bodyEl.innerHTML = md(answer);
        break;
      case "tool_call": {
        // Text before a tool call is the model thinking aloud; start a fresh answer after it.
        if (answer) { const p = node("body", md(answer)); toolsEl.appendChild(p); answer = ""; bodyEl.innerHTML = ""; }
        const chip = document.createElement("span");
        chip.className = "chip-tool running";
        chip.textContent = event.name;
        toolsEl.appendChild(chip);
        chips[event.id] = chip;
        activity(view, "call", `→ <b>${esc(event.name)}</b><pre>${esc(JSON.stringify(event.args, null, 2))}</pre>`);
        break;
      }
      case "tool_result":
        if (chips[event.id]) chips[event.id].className = "chip-tool " + (event.is_error ? "err" : "ok");
        activity(view, event.is_error ? "error" : "result", `← <b>${esc(event.name)}</b><pre>${esc(event.content)}</pre>`);
        break;
      case "subagent":
        activity(view, "sub", `🧑‍🔬 <b>subagent ${esc(event.kind)}</b> <span class="muted">${esc(event.task)}…</span>${event.kind === "started" ? "" : `<pre>${esc(event.detail)}</pre>`}`);
        break;
      case "discard_draft":
        // The server rejected that draft (the plan was not finished); the model will answer again.
        answer = "";
        bodyEl.innerHTML = "";
        break;
      case "workspace":
        renderWorkspace(view, event);
        break;
      case "done":
        msg.querySelector(".usage").textContent = `${event.requests} model calls · ${event.input_tokens ?? "?"} in / ${event.output_tokens ?? "?"} out tokens`;
        break;
      case "error":
        bodyEl.innerHTML += `<p style="color:var(--err)">Error: ${esc(event.message)}</p>`;
        break;
    }
    scrollDown(view);
  };

  try {
    const response = await fetch(`${view.base}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: view.sessionId, message: text }),
    });
    // 409: a previous message of this chat is still running (maybe in another tab).
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error ?? `HTTP ${response.status}`);
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let index;
      while ((index = buffer.indexOf("\n\n")) >= 0) {
        const frame = buffer.slice(0, index);
        buffer = buffer.slice(index + 2);
        const data = frame.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trimStart()).join("\n");
        if (data) handle(JSON.parse(data));
      }
    }
  } catch (error) {
    handle({ type: "error", message: error.message ?? String(error) });
  } finally {
    view.busy = false;
    refreshChrome();
    if (view === current) $("input").focus();
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); send(); };
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("reset").onclick = async () => {
  const view = current;
  if (!view || view.busy) return;
  await fetch(`${view.base}/reset`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: view.sessionId }) }).catch(() => {});
  const fresh = makeView(view.id, view.info, view.base);
  views.set(view.id, fresh);
  show(fresh);
};

// Console: the agent list, refreshed every 15 seconds. A view is made the
// first time an agent is opened and kept while the page lives.
let recheck;
async function loadAgents() {
  clearTimeout(recheck);
  let agents;
  try {
    agents = await (await fetch("api/agents")).json();
  } catch {
    $("meta").textContent = "console not reachable";
    return;
  }
  $("agents").replaceChildren(...agents.map((agent) => {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.id = agent.id;
    button.disabled = !agent.healthy && !views.has(agent.id);
    button.classList.toggle("down", !agent.healthy);
    button.innerHTML = `<div class="name">${esc(agent.info?.name ?? agent.id)}</div><div class="desc">${esc(agent.healthy ? agent.info.description || agent.info.model : agent.error)}</div>`;
    button.onclick = () => {
      if (!views.has(agent.id)) views.set(agent.id, makeView(agent.id, agent.info, `api/agents/${encodeURIComponent(agent.id)}`));
      history.replaceState(null, "", "#" + agent.id);
      show(views.get(agent.id));
    };
    return button;
  }));
  // A new agent can be ready a moment before its Service answers; look again soon.
  if (agents.some((agent) => !agent.healthy)) recheck = setTimeout(loadAgents, 3000);
  if (!current) {
    const wanted = agents.find((agent) => agent.id === location.hash.slice(1) && agent.healthy) ?? agents.find((agent) => agent.healthy);
    if (wanted) [...$("agents").children].find((b) => b.dataset.id === wanted.id).click();
    else $("meta").textContent = agents.length ? "no agent is reachable" : "no agents configured";
  }
  refreshChrome();
}

$("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch {}
};

if (MODE === "console") {
  $("brand-kind").textContent = ".console";
  $("title").textContent = "";
  loadAgents();
  // The console announces new, changed and deleted agents; the timer keeps
  // health up to date. A burst of changes reloads the list once.
  let pending;
  new EventSource("api/agents/events").onmessage = () => {
    clearTimeout(pending);
    pending = setTimeout(loadAgents, 250);
  };
  setInterval(loadAgents, 15000);
} else {
  fetch("v1/info").then((r) => r.json()).then((info) => {
    const view = makeView("agent", info, "v1");
    views.set(view.id, view);
    show(view);
  }).catch(() => { $("meta").textContent = "server not reachable"; });
}
</script>
</body>
</html>
