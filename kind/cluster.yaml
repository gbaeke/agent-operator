# The local cluster for agent-operator: one control plane, two workers.
#
# Apps are reached through NodePorts 32000-32009, each published on the same
# host port: a Service with nodePort 32000 is at http://<host>:32000. This
# range does not collide with the other local kind clusters (30000-31009).
# With ufw-docker, open it once:
#   sudo ufw route allow proto tcp from any to any port 32000:32009
#
# Port mappings can only be set when the cluster is created; add more here
# and recreate (cluster.sh down && cluster.sh up) if 10 is not enough.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0
    extraPortMappings:
      - { containerPort: 32000, hostPort: 32000, listenAddress: "0.0.0.0" }
      - { containerPort: 32001, hostPort: 32001, listenAddress: "0.0.0.0" }
      - { containerPort: 32002, hostPort: 32002, listenAddress: "0.0.0.0" }
      - { containerPort: 32003, hostPort: 32003, listenAddress: "0.0.0.0" }
      - { containerPort: 32004, hostPort: 32004, listenAddress: "0.0.0.0" }
      - { containerPort: 32005, hostPort: 32005, listenAddress: "0.0.0.0" }
      - { containerPort: 32006, hostPort: 32006, listenAddress: "0.0.0.0" }
      - { containerPort: 32007, hostPort: 32007, listenAddress: "0.0.0.0" }
      - { containerPort: 32008, hostPort: 32008, listenAddress: "0.0.0.0" }
      - { containerPort: 32009, hostPort: 32009, listenAddress: "0.0.0.0" }
  - role: worker
    image: kindest/node:v1.35.0
  - role: worker
    image: kindest/node:v1.35.0
