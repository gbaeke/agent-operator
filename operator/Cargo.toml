[package]
name = "agent-operator"
version = "0.1.0"
edition = "2024"
description = "Kubernetes operator: an Agent resource becomes a running agent-runtime."

[dependencies]
agent-spec = { path = "../spec" }
anyhow = "1.0.104"
futures = "0.3.34"
k8s-openapi = { version = "0.29", features = ["v1_35", "schemars"] }
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "runtime", "derive"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
