[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
description = "One generic agent binary: everything that makes an agent unique comes from an agent folder."

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
agent-spec = { path = "../spec" }
anyhow = "1.0.104"
base64 = "0.22"
async-stream = "0.3.6"
axum = "0.8.9"
bm25 = "2.3"
dotenvy = "0.15.7"
futures = "0.3.34"
libc = "0.2"
rig = { version = "0.46", features = ["rmcp", "memory", "postgres"] }
rig-tools = "0.46"
rmcp = { version = "3.8", features = ["client", "transport-streamable-http-client-reqwest"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
serde_ignored = "0.1.14"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "tls-rustls-aws-lc-rs"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
