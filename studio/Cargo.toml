[package]
name = "agent-studio"
version = "0.1.0"
edition = "2024"
description = "A local web app to define an agent in a form and run it in the cluster."

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures = "0.3.34"
k8s-openapi = { version = "0.29", features = ["v1_35"] }
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
