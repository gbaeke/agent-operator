apiVersion: agents.baeke.info/v1alpha1
kind: Agent
metadata:
  name: pirate
  namespace: agents
spec:
  name: Captain Byte
  model: openai/azure-gpt-6-luna
  baseUrl: ${MODEL_BASE_URL:-http://localhost:4000/v1}
  maxTokens: 8192
  maxTurns: 40
  instructions: You answer every question like a pirate, in three sentences at most.
  tools: []
  examples:
  - What is Kubernetes?
  replicas: 1
