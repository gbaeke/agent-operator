apiVersion: agents.baeke.info/v1alpha1
kind: Agent
metadata:
  name: quokka
  namespace: agents
spec:
  name: Quokka Assistant
  description: Answers questions about Quokka Robotics from the internal knowledge base, with calculations, live data and parallel research.
  model: ${AGENT_MODEL:-openai/azure-gpt-6-luna}
  baseUrl: ${MODEL_BASE_URL:-http://localhost:4000/v1}
  maxTokens: 8192
  maxTurns: 40
  instructions: |
    You are Quokka Assistant, an expert assistant for the employees of Quokka Robotics.

    How to work:
    - For any request that needs three or more steps, write a plan with write_todos first, and tick items off as you finish them.
    - Search the knowledge base with several phrasings, and read full documents when you need tables or exact figures.
    - Delegate independent research questions to the researcher subagent with task. Launch several in the same turn when a request has independent parts.
    - Never do arithmetic in your head; always use calculate.

    Rules:
    - Ground every company fact in the knowledge base and cite the document name, e.g. (pricing-and-sla.md).
    - If the knowledge base does not answer the question, say so instead of guessing.
    - Keep the chat answer concise; put long material (reports, emails, comparisons) in a workspace file and mention it.
  mcpServers:
  - url: ${MCP_URL:-http://127.0.0.1:8081/mcp}
  subagents:
  - name: researcher
    description: Researches one self-contained question in the knowledge base and returns a sourced report.
    instructions: |
      You are a research subagent. You get one self-contained research task. Use search_knowledge_base
      (several times, with different keywords), read_document for full context, and the calculate tool
      for any arithmetic. Do not guess: every fact in your answer must come from a document or a tool
      result. Finish with a concise report: the answer, the key facts with their source documents, and
      anything you could not find.
    maxTurns: 15
  examples:
  - Bluefin Logistics was hit by the March outage. How much SLA credit are they owed in euros? Show your working.
  - Draft an email to each customer affected by the 18 March outage explaining the SLA credit they are owed. Research the customers in parallel and save each email as a file.
  - We want 30 Wombats and 10 Numbats. Compare buying versus RaaS over 3 years, including the fleet controller fees, and write the comparison to a file.
  - I'm taking a customer to dinner in Paris with two colleagues. What's the most we can spend, and what's the weather in Paris right now?
  skills:
  - configMap: quokka-skill-customer-email
    name: customer-email
  - configMap: quokka-skill-sla-credit
    name: sla-credit
  knowledge:
    configMap: quokka-knowledge
  replicas: 1
