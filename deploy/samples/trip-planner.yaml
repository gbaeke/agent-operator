apiVersion: v1
kind: ConfigMap
data:
  SKILL.md: |
    ---
    name: packing-list
    description: Make a packing list for a trip.
    ---

    # Packing list

    1. Get the weather for the destination with get_weather.
    2. Group the list under: Clothes, Toiletries, Tech, Documents, Extras.
    3. Fit clothes to the forecast: name the expected temperatures and rain, then say what that means.
    4. Count items by the number of days (e.g. "3 T-shirts" for three days).
    5. Keep it under 25 items.
metadata:
  labels:
    app.kubernetes.io/part-of: trip-planner
  name: trip-planner-skill-packing-list
  namespace: agents
---
apiVersion: agents.baeke.info/v1alpha1
kind: Agent
metadata:
  name: trip-planner
  namespace: agents
spec:
  name: Trip Planner
  description: Plans short trips around the weather and local time, and writes packing lists.
  model: ${AGENT_MODEL:-openai/azure-gpt-6-luna}
  baseUrl: ${MODEL_BASE_URL:-http://localhost:4000/v1}
  maxTokens: 8192
  maxTurns: 15
  instructions: |
    You are a cheerful, practical trip planner. Check the live weather and local time for every
    destination before you suggest anything, and plan around them. Keep answers short, use bullet
    points, and end with one tip the traveller would not think of themselves.
  tools:
  - planning
  - skills
  mcpServers:
  - url: ${MCP_URL:-http://127.0.0.1:8081/mcp}
    tools:
    - get_weather
    - current_time
    - calculate
  examples:
  - I'm in Ghent for the weekend. What should I do on Saturday?
  - Make me a packing list for three days in Lisbon.
  skills:
  - configMap: trip-planner-skill-packing-list
    name: packing-list
  replicas: 1
