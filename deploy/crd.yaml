                      description: Model calls per task.
                      format: uint
                      minimum: 0.0
                      type: integer
                    model:
                      description: Defaults to the agent's model.
                      nullable: true
                      type: string
                    name:
                      description: How the main agent refers to this subagent.
                      type: string
                  required:
                  - description
                  - instructions
                  - name
                  type: object
                type: array
              temperature:
                description: Sampling temperature. Reasoning models may reject it.
                format: double
                nullable: true
                type: number
              tools:
                description: |-
                  The built-in tool groups to enable. Absent means all of them except
