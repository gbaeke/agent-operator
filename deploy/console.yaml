# The console: one UI for every Agent in the agents namespace, at
# http://<host>:32000. It watches the Agent resources (read-only) and
# proxies each agent's API, so agents themselves stay ClusterIP-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-console
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-console
  namespace: agents
rules:
  - apiGroups: [agents.baeke.info]
    resources: [agents]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-console
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-console
subjects:
  - kind: ServiceAccount
    name: agent-console
    namespace: agents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-console
  namespace: agents
  labels: { app.kubernetes.io/name: agent-console }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: agent-console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agent-console }
    spec:
      serviceAccountName: agent-console
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      # Chat streams are open requests; let them finish on a rollout.
      terminationGracePeriodSeconds: 120
      containers:
        - name: console
          image: agent-console:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: CONSOLE_DISCOVERY, value: kubernetes }
            - { name: CONSOLE_NAMESPACE, value: agents }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 20 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-console
  namespace: agents
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: agent-console }
  ports:
    - { name: http, port: 8080, targetPort: 8080, nodePort: 32000 }
